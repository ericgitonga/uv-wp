name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, zip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Start WordPress SQLite Local Preview & Run E2E
        run: |
          chmod +x local-preview/setup.sh
          ./local-preview/setup.sh &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:8891/about >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          BASE_URL=http://localhost:8891 python e2e/run.py
          kill $SERVER_PID || true
