name: PHP Syntax Lint & Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run php -l on all PHP files
        run: |
          find wp-content local-preview tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHP unit tests
        run: |
          if [ -f tests/run.php ]; then php tests/run.php; fi
